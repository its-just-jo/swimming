# Veröffentlichung als GitHub Pages.
#
# Der Build ist vollständig statisch: `base: './'` in vite.config.ts erzeugt
# relative Asset-Pfade, damit läuft die Seite unter
# https://<user>.github.io/<repo>/ ohne weitere Konfiguration.
#
# EINMALIGE EINRICHTUNG (nicht automatisierbar):
# Repository → Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Ohne diese Einstellung schlägt der Schritt "deploy-pages" fehl.

name: GitHub Pages

on:
  push:
    branches:
      - main
      # Derzeit der Default-Branch des Repositorys — es gibt noch kein `main`.
      # Diese Zeile entfernen, sobald nach `main` zusammengeführt wurde.
      - claude/spec-analysis-architecture-lljhu6
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deployments nicht abbrechen: ein halb abgeschlossenes Pages-Deployment
# hinterlässt sonst eine kaputte Seite.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruefen:
    name: Prüfen und bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # AP 11 ist abgenommen: der Rechenkern ist vollständig implementiert,
      # die Tests sind die ausführbare Spezifikation (siehe UMSETZUNG.md) und
      # blockieren das Deployment ab jetzt bei Rot — kein `continue-on-error`
      # mehr.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Pages konfigurieren
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Artefakt hochladen
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    name: Veröffentlichen
    # Pull Requests werden nur geprüft, nicht veröffentlicht.
    if: github.event_name != 'pull_request'
    needs: pruefen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Nach GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
